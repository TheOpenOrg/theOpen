# Server Configuration
server.port=8080

# Tinkoff Payment Configuration
tinkoff.terminalKey=${TINKOFF_TERMINAL_KEY:your_terminal_key}
tinkoff.secretKey=${TINKOFF_SECRET_KEY:your_secret_key}
tinkoff.apiUrl=${TINKOFF_API_URL:https://securepay.tinkoff.ru/v2}

# Payment Notification URL
payment.notificationUrl=${PAYMENT_NOTIFICATION_URL:https://your-domain.com/api/payment/notify}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/theopen}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.theopen.backend=INFO
